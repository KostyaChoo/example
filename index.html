<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Опрос по лекции об ИИ</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <h1>Опрос удовлетворенности</h1>
      <p>Лекция для коллег: ИИ и личный практический опыт.</p>
    </header>

    <section id="survey-view" class="card">
      <h2>Анкета участника</h2>
      <form id="survey-form" class="form-grid">
        <label>
          Имя (необязательно)
          <input type="text" name="name" placeholder="Например: Анна">
        </label>

        <label>
          Отдел
          <input type="text" name="department" placeholder="Например: Аналитика" required>
        </label>

        <label>
          Насколько полезной была лекция? (1-10)
          <input type="number" name="overall" min="1" max="10" required>
        </label>

        <label>
          Насколько понятным было объяснение сложных тем ИИ? (1-10)
          <input type="number" name="clarity" min="1" max="10" required>
        </label>

        <label>
          Что было самым ценным?
          <select name="mostUseful" required>
            <option value="">Выберите вариант</option>
            <option value="Реальные кейсы">Реальные кейсы</option>
            <option value="Демо инструментов">Демо инструментов</option>
            <option value="Практические советы">Практические советы</option>
            <option value="Ошибки и выводы">Ошибки и выводы</option>
          </select>
        </label>

        <label>
          Готовы применять ИИ в ежедневной работе?
          <select name="adoption" required>
            <option value="">Выберите вариант</option>
            <option value="Да, уже применяю">Да, уже применяю</option>
            <option value="Да, попробую в ближайшее время">Да, попробую в ближайшее время</option>
            <option value="Пока не уверен(а)">Пока не уверен(а)</option>
          </select>
        </label>

        <label class="full-width">
          Что можно улучшить в следующих лекциях?
          <textarea name="feedback" rows="4" placeholder="Ваши идеи и предложения"></textarea>
        </label>

        <button type="submit">Отправить анкету</button>
      </form>
      <p id="survey-message" class="message" aria-live="polite"></p>
    </section>

    <section id="admin-login-view" class="card">
      <h2>Вход администратора</h2>
      <form id="admin-login-form" class="inline-form">
        <input id="admin-password" type="password" placeholder="Введите пароль" required>
        <button type="submit">Войти</button>
      </form>
      <p id="admin-login-message" class="message" aria-live="polite"></p>
    </section>

    <section id="admin-dashboard-view" class="card hidden">
      <div class="dashboard-header">
        <h2>Кабинет администратора</h2>
        <button id="logout-btn" class="secondary">Выйти</button>
      </div>

      <div class="stats-grid">
        <article class="stat">
          <h3>Всего анкет</h3>
          <p id="total-count">0</p>
        </article>
        <article class="stat">
          <h3>Средняя оценка пользы</h3>
          <p id="avg-overall">0.0</p>
        </article>
        <article class="stat">
          <h3>Средняя оценка понятности</h3>
          <p id="avg-clarity">0.0</p>
        </article>
      </div>

      <div class="charts-grid">
        <article class="chart">
          <h3>Самое ценное в лекции</h3>
          <div id="useful-chart"></div>
        </article>
        <article class="chart">
          <h3>Готовность применять ИИ</h3>
          <div id="adoption-chart"></div>
        </article>
      </div>

      <article class="chart">
        <h3>Последние комментарии</h3>
        <ul id="feedback-list" class="feedback-list"></ul>
      </article>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
